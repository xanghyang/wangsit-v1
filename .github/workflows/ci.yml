name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -c "import pathlib; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in [pathlib.Path('crypto_bot.py'), *pathlib.Path('bot').glob('*.py'), *pathlib.Path('tests').glob('*.py')]]"
      - name: Unit tests
        run: python -m unittest discover -s tests

